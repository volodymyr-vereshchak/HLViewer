[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hlviewer"
version = "0.1.0"
description = "HLViewer - Hostlib Viewer Application"
requires-python = ">=3.8"

[tool.pytest.ini_options]
markers = [
    "unit: fast tests without DB or network",
    "integration: tests against the real test Postgres + ASGI app",
    "live: tests that call real external services (DPD API); excluded by default",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-m", "not live",
]
asyncio_mode = "auto"
# One shared event loop for the whole session: the app engine (module-level
# singleton in backend/db/engine.py) pools asyncpg connections that must not
# hop between per-test loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
