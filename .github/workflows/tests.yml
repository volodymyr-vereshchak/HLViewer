name: Tests

on:
  # gsm-polling is a long-lived feature branch (docs/plans/gsm-polling.md).
  # It is listed here so the suite runs on every push to it — a branch that
  # lives for weeks and is only tested when it is merged is tested too late.
  # Nothing deploys from any branch: the server is fed by make-bundles.bat,
  # which names master/main explicitly.
  push:
    branches: [ master, main, develop, gsm-polling ]
  pull_request:
    branches: [ master, main, develop, gsm-polling ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostlib_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    env:
      # tests/conftest.py forces POSTGRES_DB=hostlib_test_db and refuses to run
      # against any database whose name does not contain "test"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5434"
      JWT_SECRET: test-only-secret-not-for-production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests (unit + integration, live excluded)
      run: |
        python -m pytest -m "not live" --cov=backend --cov=utils --cov-report=term
