name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up test environment
      run: |
        echo "POSTGRES_USER=postgres" >> $GITHUB_ENV
        echo "POSTGRES_PASSWORD=postgres" >> $GITHUB_ENV
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_PORT=5432" >> $GITHUB_ENV
        echo "POSTGRES_DB=test_db" >> $GITHUB_ENV
        echo "HOSTLIB_PATH=./test_hostlibs" >> $GITHUB_ENV
        echo "CHUNK_SIZE=100" >> $GITHUB_ENV
        echo "BOT_TOKEN=test_token" >> $GITHUB_ENV
        echo "CHAT_ID=123456789" >> $GITHUB_ENV
        echo "EMAIL_PASSWORD=test_email_password" >> $GITHUB_ENV
    
    - name: Create test directories
      run: |
        mkdir -p test_hostlibs
        mkdir -p logs
    
    - name: Run basic setup tests
      run: |
        python -m pytest tests/test_basic_setup.py -v
    
    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v --cov=backend --cov=utils --cov-report=term-missing
    
    - name: Run integration tests (without database)
      run: |
        python -m pytest tests/integration/test_api_endpoints.py -v
        python -m pytest tests/integration/test_telegram_notifier.py -v
    
    - name: Run database integration tests
      run: |
        python -m pytest tests/integration/test_database_integration.py -m database -v
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        POSTGRES_DB: test_db
    
    - name: Generate coverage report
      run: |
        python -m pytest --cov=backend --cov=utils --cov-report=xml --cov-report=html:htmlcov
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/
    
    - name: Check coverage threshold
      run: |
        python -m pytest --cov=backend --cov=utils --cov-fail-under=80

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run black formatter check
      run: |
        black --check backend/ utils/ tests/
    
    - name: Run flake8 linting
      run: |
        pip install flake8
        flake8 backend/ utils/ tests/ --max-line-length=88 --extend-ignore=E203,W503

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run bandit security check
      run: |
        pip install bandit
        bandit -r backend/ -f json -o bandit-report.json || true
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit-report.json 