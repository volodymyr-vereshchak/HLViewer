services:
  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - .env
    networks:
      - hostlib_network
    ports:
      - "5432:5432"
    restart: always

  test-postgres:
    image: postgres:15
    container_name: hlviewer_test_postgres
    environment:
      POSTGRES_DB: hlviewer_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - test_pg_data:/var/lib/postgresql/data

  fastapi:
    build:
      context: .
    container_name: fastapi_app
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - hostlib_network
    command: >
      sh -c "./wait_for_it.sh db:5432 -- sh -c 'cd backend && alembic upgrade head && cd .. && uvicorn backend.api.main:app --host 0.0.0.0 --port 8000'"
    restart: always

networks:
  hostlib_network:
    external: true

volumes:
  test_pg_data: