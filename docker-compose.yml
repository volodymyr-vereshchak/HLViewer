# HLViewer production stack (formerly docker-compose.v2.yml — consolidated 2026-05-30).
# Services keep the _v2 suffix so the existing prod containers/volumes are not
# recreated. Renaming them to clean names requires a deliberate DB data migration.
# Tests run in CI against their own Postgres; for local runs point TEST_DATABASE_URL
# at any Postgres on 5432 (see tests/conftest.py).

# Rotate each container's stdout/stderr (captured by Docker's json-file driver)
# so logs never fill the disk: 10 MB per file, 5 files kept per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db_v2:
    image: postgres:15
    container_name: postgres_db_v2
    # Raise connection cap: 8 uvicorn workers + scheduler each open pools.
    command: -c max_connections=200
    # Credentials (POSTGRES_DB/USER/PASSWORD) come from .env (gitignored),
    # not hardcoded here.
    env_file:
      - .env
    ports:
      - "5434:5432"
    # Named, external volume so prod data survives container recreation AND
    # `docker compose down -v`. On a fresh host create it once before first up:
    #   docker volume create hlviewer_pgdata_v2
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
    networks:
      - hostlib_network_v2
    logging: *default-logging
    restart: always

  fastapi_v2:
    build:
      context: .
    image: hlviewer-fastapi-v2
    container_name: fastapi_app_v2
    volumes:
      - .:/app
      # AS4 archive share, read-only: the ingest only reads it (archives are
      # extracted into /app/hostlibs). Mounting //server/share onto the host
      # stays the host's job (fstab / systemd) — see docs/deployment-docker.md.
      # This only hands that host directory to the container, so a share kept
      # somewhere other than /mnt/as4 is a one-line .env change and never an
      # edit to this file (which would conflict on every update).
      # rslave: a mount the host makes there later reaches the running
      # container. Docker starts at boot without waiting for the share, and a
      # private bind would keep the empty directory it caught until a restart.
      - ${AS4_HOST_PATH:-/mnt/as4}:/mnt/as4:ro,rslave
    working_dir: /app
    env_file:
      - .env
    # POSTGRES_* (incl. password) come from .env; only non-secret networking
    # overrides are set here. DATABASE_URL is unused (URL is built from POSTGRES_*).
    environment:
      - DB_HOST=db_v2
      - DB_PORT=5432
      - TZ=Europe/Kyiv

    ports:
      - "8001:8001"
    # Cap so an OOM kills/restarts this container, not the whole box.
    # Sized for ~8 workers on an 8 GB prod (leaves room for Postgres + scheduler + OS).
    mem_limit: 5g
    # Answering /config = the app is up. The admin updater waits for this after
    # replacing the container; start_period covers alembic + preload on start.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/config', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 300s
    depends_on:
      - db_v2
    networks:
      - hostlib_network_v2
    command: >
      sh -c "./wait_for_it.sh db_v2:5432 --
             sh -c 'cd backend &&
                    alembic upgrade head &&
                    cd .. &&
                    python -m backend.db.preload_db.preload_db &&
                    uvicorn backend.api.main:app --host 0.0.0.0 --port 8001 --workers 8'"
    logging: *default-logging
    restart: always

  frontend_v2:
    # New frontend (repo hl_frontend). The image only copies the COMMITTED
    # dist/ — nothing is compiled here, so `npm run build` must be committed
    # before deploying. nginx.conf ships inside the image with that build.
    build:
      context: ../hl_frontend
      dockerfile: Dockerfile
    image: hlviewer-frontend-v2
    container_name: frontend_app_v2
    ports:
      - "3001:80"
    depends_on:
      - fastapi_v2
    networks:
      - hostlib_network_v2
    logging: *default-logging
    restart: always

  scheduler_v2:
    image: hlviewer-fastapi-v2
    container_name: scheduler_app_v2
    volumes:
      - .:/app
      # AS4 archive share, read-only: the ingest only reads it (archives are
      # extracted into /app/hostlibs). Mounting //server/share onto the host
      # stays the host's job (fstab / systemd) — see docs/deployment-docker.md.
      # This only hands that host directory to the container, so a share kept
      # somewhere other than /mnt/as4 is a one-line .env change and never an
      # edit to this file (which would conflict on every update).
      # rslave: a mount the host makes there later reaches the running
      # container. Docker starts at boot without waiting for the share, and a
      # private bind would keep the empty directory it caught until a restart.
      - ${AS4_HOST_PATH:-/mnt/as4}:/mnt/as4:ro,rslave
    working_dir: /app
    env_file:
      - .env
    environment:
      - DB_HOST=db_v2
      - DB_PORT=5432
      - TZ=Europe/Kyiv
    depends_on:
      - fastapi_v2
    networks:
      - hostlib_network_v2
    command: >
      sh -c "./wait_for_it.sh db_v2:5432 --
             python -m backend.hl_engine.scheduler_runner"
    logging: *default-logging
    restart: always

  # Admin-triggered update («Версія програми»): see docs/deployment-docker.md,
  # «Оновлення з адмінки». Opt-in through COMPOSE_PROFILES=updater in .env, so
  # a host that never set it up keeps running exactly what it ran before.
  # It holds the Docker socket — root on this host — which is why it publishes
  # no port and takes commands only from the backend (UPDATER_TOKEN).
  updater:
    profiles: ["updater"]
    build:
      context: ./updater
    image: hlviewer-updater
    container_name: hlviewer_updater
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The directory holding both checkouts, at the SAME path as on the host:
      # compose, run from in here, hands these paths to the host's daemon.
      - ${HLV_ROOT:-/opt/hlviewer}:${HLV_ROOT:-/opt/hlviewer}
    networks:
      - hostlib_network_v2
    logging: *default-logging
    restart: always

networks:
  hostlib_network_v2:
    driver: bridge

volumes:
  pgdata_v2:
    external: true
    name: hlviewer_pgdata_v2
